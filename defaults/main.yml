---
papertrail_version: "0.15"
papertrail_conf: "/etc/log_files.yml"
papertrail_host: "logs2.papertrailapp.com"
papertrail_port: 45551
papertrail_preserve_fqdn: "off"
papertrail_remote_syslog_config_paths:
  upstart:
    path: /etc/init/remote_syslog.conf
  systemd:
    path: /lib/systemd/system/remote_syslog.service
papertrail_remote_user: "papertrail"

# Apparmor
apparmor_rsyslogd_profile_path: /etc/apparmor.d/usr.sbin.rsyslogd
apparmor_rsyslogd_local_profile_path: /etc/apparmor.d/local/usr.sbin.rsyslogd
